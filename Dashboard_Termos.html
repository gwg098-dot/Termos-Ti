<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Controle de Termos TI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f7;
    color: #1a1a2e;
    min-height: 100vh;
  }

  header {
    background: #1a1a2e;
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #cc0000;
  }

  header h1 { font-size: 20px; font-weight: 700; }
  header span { font-size: 12px; color: #aaa; }

  .btn-refresh {
    background: #cc0000;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-refresh:hover { background: #aa0000; }

  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* KPIs */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .kpi {
    background: #fff;
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    border-left: 4px solid #cc0000;
  }

  .kpi.azul  { border-left-color: #0078d4; }
  .kpi.verde { border-left-color: #1a6b3a; }
  .kpi.laranja { border-left-color: #e67e00; }

  .kpi-valor {
    font-size: 36px;
    font-weight: 800;
    color: #1a1a2e;
    line-height: 1;
    margin-bottom: 4px;
  }

  .kpi-label {
    font-size: 12px;
    color: #666;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Filtros */
  .filtros {
    background: #fff;
    border-radius: 14px;
    padding: 16px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    margin-bottom: 24px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filtros label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }

  .filtros select, .filtros input {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    color: #1a1a2e;
    background: #f8f9fd;
    min-width: 160px;
  }

  /* Gráficos */
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .chart-card {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .chart-card h3 {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f0;
  }

  .chart-wrap { position: relative; height: 240px; }

  /* Tabela */
  .tabela-card {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .tabela-card h3 {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tabela-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  thead th {
    background: #f0f2f7;
    padding: 10px 12px;
    text-align: left;
    font-weight: 700;
    color: #444;
    border-bottom: 2px solid #e0e0e0;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.1s; }
  tbody tr:hover { background: #f8f9ff; }
  tbody td { padding: 9px 12px; color: #333; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-resp  { background: #ffe0e0; color: #cc0000; }
  .badge-dev   { background: #e0f0e8; color: #1a6b3a; }
  .badge-troca { background: #e0eeff; color: #0078d4; }

  .loading {
    text-align: center;
    padding: 60px;
    color: #aaa;
    font-size: 14px;
  }

  .empty {
    text-align: center;
    padding: 40px;
    color: #bbb;
    font-size: 13px;
  }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📊 Dashboard — Controle de Termos TI</h1>
    <span id="ultima-atualizacao">Carregando...</span>
  </div>
  <button class="btn-refresh" onclick="carregarDados()">↻ Atualizar</button>
</header>

<main>
  <!-- KPIs -->
  <div class="kpis">
    <div class="kpi">
      <div class="kpi-valor" id="kpi-total">—</div>
      <div class="kpi-label">Total de Termos</div>
    </div>
    <div class="kpi azul">
      <div class="kpi-valor" id="kpi-resp">—</div>
      <div class="kpi-label">Responsabilidade</div>
    </div>
    <div class="kpi verde">
      <div class="kpi-valor" id="kpi-dev">—</div>
      <div class="kpi-label">Devolução</div>
    </div>
    <div class="kpi laranja">
      <div class="kpi-valor" id="kpi-troca">—</div>
      <div class="kpi-label">Troca</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <div>
      <label>Tipo de Termo</label>
      <select id="filtro-tipo" onchange="aplicarFiltros()">
        <option value="">Todos</option>
        <option value="Responsabilidade">Responsabilidade</option>
        <option value="Devolucao">Devolução</option>
        <option value="Troca">Troca</option>
      </select>
    </div>
    <div>
      <label>Equipamento</label>
      <select id="filtro-equip" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>
    <div>
      <label>Empresa</label>
      <select id="filtro-empresa" onchange="aplicarFiltros()">
        <option value="">Todas</option>
      </select>
    </div>
    <div>
      <label>Buscar colaborador</label>
      <input type="text" id="filtro-busca" placeholder="Nome, matrícula, N° série ou patrimônio..." oninput="aplicarFiltros()" />
    </div>
  </div>

  <!-- Gráficos -->
  <div class="charts">
    <div class="chart-card">
      <h3>Tipos de Termo</h3>
      <div class="chart-wrap"><canvas id="chart-tipo"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Equipamentos Mais Entregues</h3>
      <div class="chart-wrap"><canvas id="chart-equip"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Termos por Unidade (Top 10)</h3>
      <div class="chart-wrap"><canvas id="chart-unidade"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Responsáveis pela Entrega (Top 10)</h3>
      <div class="chart-wrap"><canvas id="chart-gestor"></canvas></div>
    </div>
  </div>

  <!-- Tabela -->
  <div class="tabela-card">
    <h3>
      <span>Registros Recentes</span>
      <span id="count-registros" style="font-size:12px;color:#888;font-weight:400;"></span>
    </h3>
    <div class="tabela-wrap">
      <div id="tabela-container"><div class="loading">⏳ Carregando dados...</div></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://yiwlasnckmqodidrfpxn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZFI3RmUPg604G19RtXvkuw_ASo2AbPe';

let todosRegistros = [];
let charts = {};

async function carregarDados() {
  document.getElementById('ultima-atualizacao').textContent = 'Atualizando...';
  try {
    const resp = await fetch(SUPABASE_URL + '/rest/v1/termos_controle?select=*&order=created_at.desc', {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });

    if (!resp.ok) throw new Error('Erro ' + resp.status);

    todosRegistros = await resp.json();
    document.getElementById('ultima-atualizacao').textContent =
      'Atualizado: ' + new Date().toLocaleString('pt-BR');

    popularFiltros();
    aplicarFiltros();

  } catch(e) {
    console.error(e);
    document.getElementById('ultima-atualizacao').textContent = 'Erro ao carregar dados';
    document.getElementById('tabela-container').innerHTML =
      '<div class="empty">❌ Erro ao conectar ao banco de dados.</div>';
  }
}

function popularFiltros() {
  const equips   = [...new Set(todosRegistros.map(r => r.equipamento).filter(Boolean))].sort();
  const empresas = [...new Set(todosRegistros.map(r => r.empresa).filter(Boolean))].sort();

  const selEquip = document.getElementById('filtro-equip');
  selEquip.innerHTML = '<option value="">Todos</option>';
  equips.forEach(e => selEquip.innerHTML += `<option value="${e}">${e}</option>`);

  const selEmp = document.getElementById('filtro-empresa');
  selEmp.innerHTML = '<option value="">Todas</option>';
  empresas.forEach(e => selEmp.innerHTML += `<option value="${e}">${e}</option>`);
}

function aplicarFiltros() {
  const tipo   = document.getElementById('filtro-tipo').value;
  const equip  = document.getElementById('filtro-equip').value;
  const empresa = document.getElementById('filtro-empresa').value;
  const busca  = document.getElementById('filtro-busca').value.toLowerCase();

  const filtrados = todosRegistros.filter(r => {
    if (tipo    && r.tipo !== tipo) return false;
    if (equip   && r.equipamento !== equip) return false;
    if (empresa && r.empresa !== empresa) return false;
    if (busca && !(
      (r.nome_colaborador || '').toLowerCase().includes(busca) ||
      (r.matricula || '').toLowerCase().includes(busca) ||
      (r.chamado || '').toLowerCase().includes(busca) ||
      (r.numero_serie || '').toLowerCase().includes(busca) ||
      (r.patrimonio_imei || '').toLowerCase().includes(busca)
    )) return false;
    return true;
  });

  atualizarKPIs(filtrados);
  atualizarGraficos(filtrados);
  atualizarTabela(filtrados);
}

function atualizarKPIs(dados) {
  document.getElementById('kpi-total').textContent = dados.length;
  document.getElementById('kpi-resp').textContent  = dados.filter(r => r.tipo === 'Responsabilidade').length;
  document.getElementById('kpi-dev').textContent   = dados.filter(r => r.tipo === 'Devolucao').length;
  document.getElementById('kpi-troca').textContent = dados.filter(r => r.tipo === 'Troca').length;
}

function contarPor(dados, campo, top = 10) {
  const contagem = {};
  dados.forEach(r => {
    const val = r[campo] || 'Não informado';
    contagem[val] = (contagem[val] || 0) + 1;
  });
  return Object.entries(contagem)
    .sort((a, b) => b[1] - a[1])
    .slice(0, top);
}

function atualizarGraficos(dados) {
  // Destruir gráficos anteriores
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  const CORES = ['#cc0000','#0078d4','#1a6b3a','#e67e00','#8e44ad','#16a085','#d35400','#2c3e50','#c0392b','#27ae60'];

  // Gráfico tipos
  const tipos = contarPor(dados, 'tipo');
  charts.tipo = new Chart(document.getElementById('chart-tipo'), {
    type: 'doughnut',
    data: {
      labels: tipos.map(t => t[0]),
      datasets: [{ data: tipos.map(t => t[1]), backgroundColor: ['#cc0000','#0078d4','#e67e00'], borderWidth: 2, borderColor: '#fff' }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } } }
  });

  // Gráfico equipamentos
  const equips = contarPor(dados, 'equipamento');
  charts.equip = new Chart(document.getElementById('chart-equip'), {
    type: 'bar',
    data: {
      labels: equips.map(e => e[0]),
      datasets: [{ data: equips.map(e => e[1]), backgroundColor: CORES, borderRadius: 6 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  // Gráfico unidades
  const unidades = contarPor(dados, 'unidade');
  charts.unidade = new Chart(document.getElementById('chart-unidade'), {
    type: 'bar',
    data: {
      labels: unidades.map(u => u[0]),
      datasets: [{ data: unidades.map(u => u[1]), backgroundColor: '#0078d4', borderRadius: 6 }]
    },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  // Gráfico técnicos de TI responsáveis
  const gestores = contarPor(dados, 'nome_ti');
  charts.gestor = new Chart(document.getElementById('chart-gestor'), {
    type: 'bar',
    data: {
      labels: gestores.map(g => g[0]),
      datasets: [{ data: gestores.map(g => g[1]), backgroundColor: '#1a6b3a', borderRadius: 6 }]
    },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });
}

function atualizarTabela(dados) {
  document.getElementById('count-registros').textContent = dados.length + ' registro(s)';

  if (dados.length === 0) {
    document.getElementById('tabela-container').innerHTML = '<div class="empty">Nenhum registro encontrado.</div>';
    return;
  }

  const badgeClasse = tipo => {
    if (tipo === 'Responsabilidade') return 'badge-resp';
    if (tipo === 'Devolucao') return 'badge-dev';
    return 'badge-troca';
  };

  const badgeLabel = tipo => {
    if (tipo === 'Devolucao') return 'Devolução';
    return tipo || '—';
  };

  const html = `
    <table>
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th>Chamado</th>
          <th>Colaborador</th>
          <th>Matrícula</th>
          <th>Tipo</th>
          <th>Equipamento</th>
          <th>Nº Série</th>
          <th>Patrimônio/IMEI</th>
          <th>Empresa</th>
          <th>Unidade</th>
          <th>Técnico TI</th>
          <th>Gestor</th>
          <th>Arquivo</th>
        </tr>
      </thead>
      <tbody>
        ${dados.map(r => `
          <tr>
            <td>${r.created_at ? new Date(r.created_at).toLocaleString('pt-BR') : '—'}</td>
            <td>${r.chamado || '—'}</td>
            <td>${r.nome_colaborador || '—'}</td>
            <td>${r.matricula || '—'}</td>
            <td><span class="badge ${badgeClasse(r.tipo)}">${badgeLabel(r.tipo)}</span></td>
            <td>${r.equipamento || '—'}</td>
            <td>${r.numero_serie || '—'}</td>
            <td>${r.patrimonio_imei || '—'}</td>
            <td>${r.empresa || '—'}</td>
            <td>${r.unidade || '—'}</td>
            <td>${r.nome_ti || '—'}</td>
            <td>${r.nome_gestor || '—'}</td>
            <td style="font-size:10px;color:#888;">${r.filename || '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  document.getElementById('tabela-container').innerHTML = html;
}

// Carregar ao abrir
carregarDados();
</script>
</body>
</html>
